name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Check Android project files
    run: |
      if [ ! -f gradlew ]; then
        echo "ERROR: gradlew not found in repository root."
        echo "Upload a complete Android Gradle project first."
        exit 1
      fi
      if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
        echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
        exit 1
      fi

  - name: Make Gradle executable
    run: chmod +x gradlew

  - name: Build debug APK
    run: ./gradlew --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Pump-Research-Lab-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
